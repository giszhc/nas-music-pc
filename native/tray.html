<!doctype html>
<html lang="zh-CN" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聆境音乐</title>
<style>
:root{color-scheme:dark;--ink:#f4f5f8;--muted:#cbd0da;--surface:rgba(28,30,38,.88);--line:rgba(255,255,255,.18);--button:rgba(255,255,255,.09);--accent:#ce268c}
:root[data-theme=light]{color-scheme:light;--ink:#253344;--muted:#647285;--surface:rgba(250,252,255,.72);--line:rgba(255,255,255,.8);--button:rgba(42,60,80,.06)}
*{box-sizing:border-box}html,body{margin:0;background:transparent;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);overflow:hidden}body{padding:8px}.panel{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(145deg,rgba(255,255,255,.06),transparent 55%),var(--surface);backdrop-filter:blur(32px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 14px rgba(0,0,0,.12);transform-origin:50% 0;transition:background .25s,color .25s}.panel.enter{animation:appear .28s cubic-bezier(.16,1,.3,1)}.identity{display:flex;align-items:center;gap:12px}.cover{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--button);color:var(--accent)}.copy{min-width:0;flex:1}#title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#status{margin-top:5px;font-size:11px;color:var(--muted)}button{border:0;color:inherit;font:inherit;cursor:pointer;background:none;transition:transform .18s,background .18s,opacity .18s}button:hover{background:var(--button)}button:active{transform:scale(.92)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}svg{width:20px;height:20px;fill:currentColor;display:block}.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin:18px 0}.controls button{border-radius:50%;width:38px;height:38px;display:grid;place-items:center}#toggle{width:48px;height:48px;background:var(--ink);color:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.1)}#toggle svg{color:var(--ink);filter:invert(1)}#toggle.changed svg{animation:switch .2s ease-out}footer{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between}footer button{color:var(--muted);padding:5px 8px;border-radius:7px;font-size:11px}@keyframes appear{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}@keyframes switch{from{opacity:.3;transform:scale(.75)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<div class="panel" id="panel"><div class="identity"><div class="cover"><svg viewBox="0 0 24 24"><path d="M9 3v12.3A3.5 3.5 0 1 0 11 18V7l8-2v8.3a3.5 3.5 0 1 0 2 3.2V1z"/></svg></div><div class="copy"><div id="title">暂无播放</div><div id="status">聆境音乐</div></div></div><div class="controls"><button data-action="previous" aria-label="上一曲"><svg viewBox="0 0 24 24"><path d="M5 5h2v14H5zm14 0v14L8 12z"/></svg></button><button id="toggle" data-action="toggle" aria-label="播放"><svg viewBox="0 0 24 24"><path id="playPath" d="M8 5v14l11-7z"/></svg></button><button data-action="next" aria-label="下一曲"><svg viewBox="0 0 24 24"><path d="M17 5h2v14h-2zM5 5l11 7-11 7z"/></svg></button></div><footer><button data-action="show">打开聆境音乐</button><button data-action="quit">退出应用</button></footer></div>
<script>
let lastPlaying;
window.updatePlayer=({title,playing,theme,accent})=>{document.documentElement.dataset.theme=theme||'dark';if(accent)document.documentElement.style.setProperty('--accent',accent);document.getElementById('title').textContent=title;document.getElementById('title').title=title;document.getElementById('status').textContent=playing?'正在播放':title==='暂无播放'?'聆境音乐':'已暂停';document.getElementById('toggle').setAttribute('aria-label',playing?'暂停':'播放');document.getElementById('playPath').setAttribute('d',playing?'M6 5h4v14H6zm8 0h4v14h-4z':'M8 5v14l11-7z');if(lastPlaying!==playing){const b=document.getElementById('toggle');b.classList.remove('changed');void b.offsetWidth;b.classList.add('changed')}lastPlaying=playing};
window.presentPlayer=()=>{const p=document.getElementById('panel');p.classList.remove('enter');void p.offsetWidth;p.classList.add('enter')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)window.__TAURI__.core.invoke('tray_action',{action:b.dataset.action}).catch(console.error)});
</script></html>
